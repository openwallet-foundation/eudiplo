packages:
  - apps/*
  - packages/*

publicHoistPattern:
  - '*'

# The @nestjs/swagger CLI plugin imports the TypeScript compiler API, but does not
# declare typescript itself. Without this it resolves the hoisted typescript 7 (the
# native port, which exposes no compiler API) and the CLI reports the plugin as
# incompatible. Pin it to the TypeScript 6 the backend and @nestjs/cli use.
packageExtensions:
  '@ngx-formly/material@7.1.0':
    peerDependencies:
      rxjs: '~7.8.2'
  '@nestjs/swagger':
    peerDependencies:
      typescript: '^6.0.0'
  'ngx-monaco-editor-v2@22.0.5':
    peerDependencies:
      rxjs: '~7.8.2'

allowBuilds:
  '@compodoc/compodoc': true
  '@nestjs/core': true
  '@parcel/watcher': true
  '@scarf/scarf': true
  '@swc/core': true
  bcrypt: true
  better-sqlite3: true
  cbor-extract: true
  core-js: true
  cpu-features: true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  pkcs11js: true
  protobufjs: true
  sharp: true
  sqlite3: true
  ssh2: true
  workerd: true

injectWorkspacePackages: true

onlyBuiltDependencies:
  - '@compodoc/compodoc'
  - '@nestjs/core'
  - '@parcel/watcher'
  - '@scarf/scarf'
  - '@swc/core'
  - bcrypt
  - cbor-extract
  - cpu-features
  - esbuild
  - lmdb
  - msgpackr-extract
  - pkcs11js
  - protobufjs
  - sharp
  - sqlite3
  - ssh2
  - workerd

syncInjectedDepsAfterScripts:
  - build

minimumReleaseAge: 0

overrides:
  dompurify@<3.4.9: ^3.4.9
  dompurify@<=3.4.10: ^3.4.11
  dompurify@<=3.4.11: ^3.4.12
  dompurify@<=3.4.12: ^3.4.13
  multer@<2.3.0: ^2.3.0
  qs@>=2.2.5 <6.16.0: ^6.16.0
  qs@>=6.14.2 <=6.15.3: ^6.15.4
  serialize-javascript@<=7.0.2: ^7.0.3
  serialize-javascript@>=5.0.0 <7.0.5: ^7.0.5
  undici@<6.23.0: ^6.23.0
  undici@<6.24.0: ^6.24.0
  undici@<6.27.0: ^6.27.0
  undici@<6.28.0: ^6.28.0
  uuid@<11.1.1: ^11.1.1
