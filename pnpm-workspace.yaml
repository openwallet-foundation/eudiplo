packages:
  - apps/*
  - packages/*

publicHoistPattern:
  - '*'

# The @nestjs/swagger CLI plugin imports the TypeScript compiler API, but does not
# declare typescript itself. Without this it resolves the hoisted typescript 7 (the
# native port, which exposes no compiler API) and the CLI reports the plugin as
# incompatible. Pin it to the TypeScript 6 the backend and @nestjs/cli use.
packageExtensions:
  '@nestjs/swagger':
    peerDependencies:
      typescript: '^6.0.0'

allowBuilds:
  '@compodoc/compodoc': true
  '@nestjs/core': true
  '@parcel/watcher': true
  '@scarf/scarf': true
  '@swc/core': true
  bcrypt: true
  better-sqlite3: true
  cbor-extract: true
  core-js: true
  cpu-features: true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  pkcs11js: true
  protobufjs: true
  sharp: true
  sqlite3: true
  ssh2: true
  workerd: true

injectWorkspacePackages: true

onlyBuiltDependencies:
  - '@compodoc/compodoc'
  - '@nestjs/core'
  - '@parcel/watcher'
  - '@scarf/scarf'
  - '@swc/core'
  - bcrypt
  - cbor-extract
  - cpu-features
  - esbuild
  - lmdb
  - msgpackr-extract
  - pkcs11js
  - protobufjs
  - sharp
  - sqlite3
  - ssh2
  - workerd

syncInjectedDepsAfterScripts:
  - build

minimumReleaseAge: 0
